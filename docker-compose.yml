services:
  # 1. Spring Boot Application
  app:
    build: .
    container_name: morningcommit-app
    ports:
      - "18080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      # Database Config
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # RabbitMQ Config
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      # Mail Config (SMTP)
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # Redis Config
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      # Elasticsearch Config
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # Application Config
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_UNSUBSCRIBE_SECRET=${APP_UNSUBSCRIBE_SECRET}
      # OpenAI Config
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - morningcommit-net

  # 2. MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: morningcommit-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: morningcommit
      TZ: Asia/Seoul
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morningcommit-net

  # 3. Redis
  redis:
    image: redis:alpine
    container_name: morningcommit-redis
    ports:
      - "16379:6379"
    networks:
      - morningcommit-net

  # 4. Elasticsearch
  elasticsearch:
    build: ./docker/elasticsearch
    container_name: morningcommit-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "19200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - morningcommit-net

  # 5. RabbitMQ
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: morningcommit-mq
    ports:
      - "15673:5672"
      - "25672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morningcommit-net

    # 6. Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    ports:
      - "15601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - morningcommit-net

networks:
  morningcommit-net:
    driver: bridge

volumes:
  mysql_data:
  es_data: