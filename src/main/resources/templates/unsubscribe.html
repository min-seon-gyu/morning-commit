<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구독 취소 - MorningCommit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
            <!-- Logo -->
            <div class="mb-6">
                <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center mx-auto">
                    <span class="text-2xl font-bold text-white">M</span>
                </div>
                <h1 class="mt-3 text-xl font-bold text-gray-800">MorningCommit</h1>
            </div>

            <!-- Confirm State -->
            <div id="confirmSection" th:if="${state == 'confirm'}">
                <div class="mb-6">
                    <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                        </svg>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-800 mb-2">정말 구독을 취소하시겠습니까?</h2>
                    <p class="text-sm text-gray-500 mb-1" th:text="${email}">user@example.com</p>
                    <p class="text-sm text-gray-400">구독을 취소하면 더 이상 뉴스레터를 받지 않습니다.</p>
                </div>
                <button id="unsubscribeBtn" onclick="executeUnsubscribe()"
                        class="w-full py-3 px-4 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg transition-colors duration-200">
                    구독 취소
                </button>
                <a th:href="@{/}" class="inline-block mt-4 text-sm text-gray-400 hover:text-gray-600 transition-colors">돌아가기</a>
            </div>

            <!-- Success Result -->
            <div id="successResult" class="hidden">
                <div class="mb-6">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-800 mb-2">구독이 취소되었습니다</h2>
                    <p class="text-sm text-gray-400">그동안 이용해 주셔서 감사합니다.</p>
                </div>
                <a th:href="@{/}" class="inline-block py-3 px-6 bg-gray-800 hover:bg-gray-900 text-white font-semibold rounded-lg transition-colors duration-200">홈으로 돌아가기</a>
            </div>

            <!-- Fail Result -->
            <div id="failResult" class="hidden">
                <div class="mb-6">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-800 mb-2">구독 취소 실패</h2>
                    <p id="failMessage" class="text-sm text-gray-400">오류가 발생했습니다.</p>
                </div>
                <a th:href="@{/}" class="inline-block py-3 px-6 bg-gray-800 hover:bg-gray-900 text-white font-semibold rounded-lg transition-colors duration-200">홈으로 돌아가기</a>
            </div>

            <!-- Error State (invalid token on page load) -->
            <div th:if="${state == 'error'}">
                <div class="mb-6">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-800 mb-2">유효하지 않은 요청입니다</h2>
                    <p class="text-sm text-gray-400">링크가 올바르지 않거나 만료되었습니다.</p>
                </div>
                <a th:href="@{/}" class="inline-block py-3 px-6 bg-gray-800 hover:bg-gray-900 text-white font-semibold rounded-lg transition-colors duration-200">홈으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script th:if="${state == 'confirm'}" th:inline="javascript">
        var email = /*[[${email}]]*/ '';
        var token = /*[[${token}]]*/ '';

        function executeUnsubscribe() {
            var btn = document.getElementById('unsubscribeBtn');
            btn.disabled = true;
            btn.textContent = '처리 중...';

            fetch('/api/subscribers/unsubscribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email, token: token})
            })
            .then(function (res) {
                document.getElementById('confirmSection').classList.add('hidden');
                if (res.ok) {
                    document.getElementById('successResult').classList.remove('hidden');
                } else {
                    document.getElementById('failMessage').textContent = '구독 취소에 실패했습니다.';
                    document.getElementById('failResult').classList.remove('hidden');
                }
            })
            .catch(function () {
                document.getElementById('confirmSection').classList.add('hidden');
                document.getElementById('failMessage').textContent = '네트워크 오류가 발생했습니다.';
                document.getElementById('failResult').classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
