<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>MorningCommit 이메일 인증</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #F4F5F7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <!-- Outer Container -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #F4F5F7;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <!-- Inner Container (600px max) -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width: 600px; width: 100%;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 30px 40px; background-color: #1E293B; border-radius: 12px 12px 0 0;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center">
                                        <!-- Logo Icon -->
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td style="width: 48px; height: 48px; background-color: #3B82F6; border-radius: 10px; text-align: center; vertical-align: middle;">
                                                    <span style="font-size: 24px; color: #FFFFFF; font-weight: bold;">M</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top: 16px;">
                                        <span style="font-size: 28px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.5px;">MorningCommit</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top: 8px;">
                                        <span style="font-size: 14px; color: #94A3B8;">이메일 인증</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body Section -->
                    <tr>
                        <td style="padding: 40px 40px 32px 40px; background-color: #FFFFFF;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <span style="font-size: 18px; font-weight: 600; color: #1E293B;">구독 인증번호 안내</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top: 12px;">
                                        <span style="font-size: 14px; color: #64748B; line-height: 1.6;">MorningCommit 뉴스레터 구독을 위해<br/>아래 인증번호를 입력해 주세요.</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Verification Code Card -->
                    <tr>
                        <td style="padding: 0 40px 32px 40px; background-color: #FFFFFF;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #F8FAFC; border-radius: 10px; border: 1px solid #E2E8F0;">
                                <tr>
                                    <td align="center" style="padding: 32px 24px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center">
                                                    <span style="font-size: 13px; font-weight: 600; color: #3B82F6; text-transform: uppercase; letter-spacing: 1.5px;">인증번호</span>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td align="center" style="padding-top: 16px;">
                                                    <span th:text="${code}" style="font-size: 40px; font-weight: 800; color: #1E293B; letter-spacing: 8px; font-family: 'Courier New', Courier, monospace;">000000</span>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td align="center" style="padding-top: 16px;">
                                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                                        <tr>
                                                            <td style="background-color: #FEF3C7; padding: 6px 14px; border-radius: 20px;">
                                                                <span style="font-size: 12px; font-weight: 600; color: #92400E;">&#9200; 5분간 유효합니다</span>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Notice Section -->
                    <tr>
                        <td style="padding: 0 40px 32px 40px; background-color: #FFFFFF;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td style="padding: 16px; background-color: #EFF6FF; border-radius: 8px;">
                                        <span style="font-size: 13px; color: #1E40AF; line-height: 1.6;">&#128274; 본인이 요청하지 않은 인증번호라면 이 메일을 무시해 주세요.</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="padding: 0 40px; background-color: #FFFFFF;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td style="border-top: 1px solid #E2E8F0;"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 32px 40px; background-color: #FFFFFF; border-radius: 0 0 12px 12px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <span style="font-size: 13px; color: #94A3B8; line-height: 1.6;">매일 아침, 엄선된 기술 블로그 아티클을 전해드립니다.</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top: 16px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td style="background-color: #1E293B; border-radius: 6px;">
                                                    <a th:href="${baseUrl}" style="display: inline-block; padding: 12px 24px; font-size: 14px; font-weight: 600; color: #FFFFFF; text-decoration: none;">MorningCommit 방문하기</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-top: 20px;">
                                        <span style="font-size: 12px; color: #CBD5E1;">&copy; 2025 MorningCommit. All rights reserved.</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
