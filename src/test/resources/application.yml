spring:
  application:
    name: morning-commit

  cache:
    type: none

  # ==========================================
  # 1. 데이터베이스 설정
  # ==========================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ==========================================
  # 2. Redis 설정 (추가됨)
  # ==========================================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # ==========================================
  # 3. Elasticsearch 설정
  # ==========================================
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
    username: elastic
    password: ${ELASTIC_PASSWORD}
  # ==========================================
  # 4. RabbitMQ 설정
  # ==========================================
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  # ==========================================
  # 4. 이메일 설정 (SMTP)
  # ==========================================
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          starttls:
            enable: true

  # ==========================================
  # 5. Spring Batch 설정
  # ==========================================
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  # ==========================================
  # 6. Spring AI (OpenAI) 설정
  # ==========================================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

app:
  base-url: ${APP_BASE_URL}
  unsubscribe-secret: ${UNSUBSCRIBE_SECRET:}
